name: Vulpes3DGS
options:
  bundleIdPrefix: com.vulpes3dgs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Vulpes3DGS:
    type: application
    platform: iOS
    sources:
      - path: KitScan3D
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vulpes3dgs.app
        INFOPLIST_FILE: KitScan3D/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        MTL_ENABLE_DEBUG_INFO: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - Vulpes3DGSTests

  Vulpes3DGSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KitScan3DTests
    dependencies:
      - target: Vulpes3DGS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vulpes3dgs.tests
        GENERATE_INFOPLIST_FILE: YES
